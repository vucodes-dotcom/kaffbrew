{
  "media": {
    "input": "media",
    "output": "/kaffbrew/media",
    "extensions": [
      "jpg",
      "jpeg",
      "png",
      "webp"
    ],
    "rename": "random"
  },
  "content": [
    {
      "name": "home",
      "label": "01 · Ảnh & chữ đầu trang",
      "type": "file",
      "path": "draft-home.json",
      "format": "json",
      "fields": [
        {
          "name": "title",
          "label": "Tiêu đề lớn",
          "type": "text",
          "required": true,
          "description": "Xuống dòng để chia thành hai dòng."
        },
        {
          "name": "image",
          "label": "Ảnh đầu trang",
          "type": "image",
          "description": "Chọn ảnh hoặc tải ảnh mới. Nên dùng JPG, PNG hoặc WebP, dưới 5 MB.",
          "options": {
            "extensions": [
              "jpg",
              "jpeg",
              "png",
              "webp"
            ],
            "rename": "random"
          }
        },
        {
          "name": "imageAlt",
          "label": "Mô tả ngắn về ảnh",
          "type": "string"
        },
        {
          "name": "position",
          "label": "Vị trí trọng tâm ảnh",
          "type": "select",
          "options": {
            "values": [
              {
                "name": "left",
                "label": "Bên trái"
              },
              {
                "name": "center",
                "label": "Ở giữa"
              },
              {
                "name": "right",
                "label": "Bên phải"
              }
            ]
          }
        },
        {
          "name": "intro",
          "label": "Đoạn giới thiệu 1",
          "type": "text"
        },
        {
          "name": "intro2",
          "label": "Đoạn giới thiệu 2",
          "type": "text"
        },
        {
          "name": "button",
          "label": "Chữ trên nút đặt hàng",
          "type": "string"
        },
        {
          "name": "note",
          "label": "Dòng chữ nhỏ trên ảnh",
          "type": "text"
        }
      ],
      "actions": [
        {
          "name": "publish",
          "label": "Đăng lên website",
          "workflow": "publish-content.yml",
          "ref": "main",
          "cancelable": false,
          "confirm": {
            "title": "Đăng các thay đổi?",
            "message": "Hãy bấm Save ở các mục đã sửa và xem bản nháp trước. Nội dung sẽ hiển thị cho khách sau khoảng 1–2 phút.",
            "button": "Đăng lên website"
          }
        }
      ]
    },
